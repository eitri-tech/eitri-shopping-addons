name: Publish Eitri Apps

on:
  push:
    branches:
      - develop
      - main

env:
  EITRI_CLI_CLIENT_ID: ${{ secrets.EITRI_CLI_CLIENT_ID }}
  EITRI_CLI_CLIENT_SECRET: ${{ secrets.EITRI_CLI_CLIENT_SECRET }}

  DEV_ENVID: 55761c57-81bb-4189-999c-38b12ed14956
  PROD_ENVID: 2ddcf3e5-3bd3-492e-82b3-4830a0674636

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Eitri CLI
        run: npm install -g eitri-cli

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Detect changed Eitri apps
        id: detect
        run: |
          echo "Detectando módulos alterados..."
          CHANGED_MODULES=""

          # Obtém alterações entre HEAD local e remoto
          git fetch origin ${{ github.ref_name }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.ref_name }})

          # Extrai paths dos módulos do app-config.yaml
          MODULE_PATHS=$(yq eval '.eitri-apps[].path' app-config.yaml)

          for path in $MODULE_PATHS; do
            if echo "$CHANGED_FILES" | grep -q "^${path}/"; then
              CHANGED_MODULES="$CHANGED_MODULES $path"
            fi
          done

          echo "Módulos alterados: $CHANGED_MODULES"
          echo "changed_modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT

      - name: Process changed modules
        if: steps.detect.outputs.changed_modules != ''
        run: |
          for module in ${{ steps.detect.outputs.changed_modules }}; do
            echo "Processando módulo: $module"

            cd $module

            # Determina ambiente (DEV ou PROD)
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              ENV_ID="${{ env.PROD_ENVID }}"
            else
              ENV_ID="${{ env.DEV_ENVID }}"
            fi

            # Verifica se o módulo é compartilhado
            SHARED=$(yq eval ".\"eitri-apps\"[] | select(.path == \"./$module\") | .shared" ../app-config.yaml)

            if [[ "$SHARED" == "true" ]]; then
              echo "Módulo $module é compartilhado. Executando 'eitri push-version --shared'"
              eitri push-version --shared
            else
              echo "Módulo $module não é compartilhado. Executando 'eitri push-version'"
              eitri push-version
            fi

            echo "Publicando com 'eitri publish -e $ENV_ID'"
            eitri publish -e $ENV_ID

            cd -
          done
