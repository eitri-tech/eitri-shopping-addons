name: Publish Eitri Apps

on:
  pull_request:
    branches:
      - develop
      - main

env:
  EITRI_CLI_CLIENT_ID: ${{ secrets.EITRI_CLI_CLIENT_ID }}
  EITRI_CLI_CLIENT_SECRET: ${{ secrets.EITRI_CLI_CLIENT_SECRET }}

  DEV_ENVID: 55761c57-81bb-4189-999c-38b12ed14956
  PROD_ENVID: 2ddcf3e5-3bd3-492e-82b3-4830a0674636

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Para garantir que todos os commits estão disponíveis

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Eitri CLI
        run: npm install -g eitri-cli

      - name: Install yq v4 locally
        run: |
          mkdir -p $HOME/bin
          curl -L https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -o $HOME/bin/yq
          chmod +x $HOME/bin/yq
          echo "$HOME/bin" >> $GITHUB_PATH
          yq --version

      - name: Detect changed Eitri apps
        id: detect
        run: |
          set -e
          set -x
          trap 'echo "❌ Falha na detecção de módulos alterados!"' ERR

          echo "🔍 Detectando módulos alterados..."

          if [ ! -f app-config.yaml ]; then
            echo "❌ Arquivo app-config.yaml não encontrado na raiz do repositório."
            exit 1
          fi

          CHANGED_MODULES=""

          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          echo "🔗 Base SHA: $BASE_SHA"
          echo "🔗 Head SHA: $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)

          echo "📝 Arquivos alterados detectados:"
          echo "$CHANGED_FILES"

          MODULE_PATHS=$(yq eval '.eitri-apps[].path' app-config.yaml)

          echo "📂 Paths configurados no app-config.yaml:"
          echo "$MODULE_PATHS"

          for path in $MODULE_PATHS; do
            NORMALIZED_PATH=${path#./}
            echo "🔎 Verificando se $NORMALIZED_PATH foi alterado..."

            MATCH=$(echo "$CHANGED_FILES" | grep -E "^${NORMALIZED_PATH}/" || true)

            if [ -n "$MATCH" ]; then
              echo "✅ Módulo $path alterado."
              CHANGED_MODULES="$CHANGED_MODULES $path"
            else
              echo "❌ Nenhuma alteração detectada em ./$NORMALIZED_PATH."
            fi
          done

          if [ -z "$CHANGED_MODULES" ]; then
            echo "✅ Nenhum módulo alterado."
          else
            echo "✅ Módulos alterados: $CHANGED_MODULES"
          fi

          echo "changed_modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT

      - name: Process changed modules
        if: steps.detect.outputs.changed_modules != ''
        run: |
          set -e
          set -x
          trap 'echo "❌ Falha no processamento dos módulos!"' ERR

          for module in ${{ steps.detect.outputs.changed_modules }}; do
            echo "🚀 Processando módulo: $module"

            if [ ! -d "$module" ]; then
              echo "⚠️ Diretório $module não encontrado. Pulando..."
              continue
            fi

            cd $module

            if [[ "${{ github.base_ref }}" == "main" ]]; then
              ENV_ID="${{ env.PROD_ENVID }}"
            else
              ENV_ID="${{ env.DEV_ENVID }}"
            fi

            echo "🌍 Ambiente selecionado: $ENV_ID"

            SHARED=$(yq eval ".\"eitri-apps\"[] | select(.path == \"./$module\") | .shared" ../app-config.yaml)

            if [[ "$SHARED" == "true" ]]; then
              echo "🔗 Módulo $module é compartilhado. Executando 'eitri push-version --shared'"
              eitri push-version --shared
            else
              echo "🔗 Módulo $module não é compartilhado. Executando 'eitri push-version'"
              eitri push-version
            fi

            echo "📦 Publicando com 'eitri publish -e $ENV_ID'"
            eitri publish -e $ENV_ID

            cd -
            echo "✅ Finalizado processamento do módulo: $module"
          done
