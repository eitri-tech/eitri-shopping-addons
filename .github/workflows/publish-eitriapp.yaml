name: Publish Eitriapp

on:
  push:
    branches:
      - develop
      - main

env:
  EITRI_CLI_CLIENT_ID: ${{ secrets.EITRI_CLI_CLIENT_ID }}
  EITRI_CLI_CLIENT_SECRET: ${{ secrets.EITRI_CLI_CLIENT_SECRET }}

jobs:
  publish-miniapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Install Eitri CLI
        run: npm i -g eitri-cli

      - name: Set environment ID based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "Branch é main, configurando para produção..."
            echo "ENVIRONMENT_ID=55761c57-81bb-4189-999c-38b12ed14956" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "Branch é develop, configurando para homologação..."
            echo "ENVIRONMENT_ID=2ddcf3e5-3bd3-492e-82b3-4830a0674636" >> $GITHUB_ENV
          else
            echo "Branch não reconhecida, saindo..."
            exit 1
          fi

      - name: Detect changed folders at root
        id: changed
        run: |
          echo "Detectando pastas alteradas..."

          git fetch origin ${{ github.ref_name }}

          CHANGED=$(git diff --name-only origin/${{ github.ref_name }}...${{ github.sha }} \
            | awk -F/ '{print $1}' \
            | sort -u \
            | grep -vE '^\.')

          echo "Pastas candidatas: $CHANGED"

          CHANGED_APPS=""
          for folder in $CHANGED; do
            if [ -f "$folder/eitri-app.conf.js" ]; then
              echo "✅ $folder contém eitri-app.conf.js"
              CHANGED_APPS="$CHANGED_APPS $folder"
            fi
          done

          echo "changed_folders=$(echo \"$CHANGED_APPS\" | xargs)" >> $GITHUB_OUTPUT
          echo "Pastas com alterações relevantes: $CHANGED_APPS"

      - name: Loop through and publish changed folders
        run: |
          echo "Iniciando publicação nas pastas alteradas..."

          CHANGED="${{ steps.changed.outputs.changed_folders }}"

          for folder in $CHANGED; do
            echo "📁 Processando pasta $folder"

            cd "$folder"

            echo "🔍 Lendo versão de $folder..."
            VERSION=$(node -p "require('./eitri-app.conf.js').version")
            echo "Versão detectada: $VERSION"

            echo "🚀 Executando 'eitri push-version --shared'"
            eitri push-version --shared

            echo "📦 Publicando com 'eitri publish -e $ENVIRONMENT_ID'"
            eitri publish -e $ENVIRONMENT_ID

            echo "⬅️ Voltando para a raiz do projeto"
            cd -
          done
